<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCP App · 航班助手</title>
  <style>
    :root {
      --bg: #f4f6fb; --card: #ffffff; --text: #1a202c; --muted: #718096;
      --brand: #0284c7; --brand2: #0ea5e9; --border: #e2e8f0; --ok: #16a34a; --err: #dc2626;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    header { background: linear-gradient(135deg, #0369a1, #0ea5e9); color: #fff; padding: 18px 26px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    header h1 { font-size: 19px; }
    header .pill { background: rgba(255,255,255,.18); padding: 6px 14px; border-radius: 999px; font-size: 13px; }
    main { display: grid; grid-template-columns: 340px 1fr; gap: 20px; padding: 24px; max-width: 1180px; margin: 0 auto; align-items: start; }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
    .panel { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
    .panel h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin-bottom: 12px; }
    .field { margin-bottom: 12px; }
    .field label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
    .field input, .field select { width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; background: #fff; }
    .field input:focus, .field select:focus { outline: 2px solid rgba(2,132,199,.25); border-color: var(--brand); }
    .btn { width: 100%; padding: 10px; border: 0; border-radius: 8px; background: var(--brand); color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity .15s; }
    .btn:hover { opacity: .85; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn.ghost { background: #e0f2fe; color: var(--brand); margin-top: 10px; }
    #render { min-height: 200px; }
    #status { font-size: 12px; color: var(--muted); margin-top: 12px; min-height: 18px; }
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -3px; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 40px 0; }
    .error { background: #fef2f2; border: 1px solid #fecaca; color: var(--err); border-radius: 10px; padding: 14px; font-size: 13px; }
    /* flights */
    .flight { border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; background: #fff; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
    .flight:hover { border-color: var(--brand); box-shadow: 0 2px 10px rgba(2,132,199,.14); }
    .flight .f-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .flight .f-id { font-weight: 700; font-size: 14px; }
    .flight .f-route { font-size: 15px; font-weight: 600; }
    .flight .f-time { font-size: 13px; color: var(--muted); margin: 6px 0; }
    .flight .f-meta { display: flex; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
    .badge { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 3px 10px; text-transform: uppercase; }
    .badge.ok { background: #dcfce7; color: var(--ok); }
    .badge.warn { background: #fef3c7; color: #b45309; }
    .badge.err { background: #fee2e2; color: var(--err); }
    .badge.info { background: #e0f2fe; color: var(--brand); }
    /* detail */
    .d-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0; }
    .d-grid div { text-align: center; background: #f8fafc; border-radius: 10px; padding: 12px 6px; }
    .d-grid b { display: block; font-size: 16px; }
    .d-grid span { font-size: 12px; color: var(--muted); }
    .d-route { display: flex; align-items: center; gap: 12px; padding: 16px; background: linear-gradient(135deg, #e0f2fe, #f0f9ff); border-radius: 12px; }
    .d-route .city { font-size: 20px; font-weight: 700; }
    .d-route .air { font-size: 12px; color: var(--muted); flex: 1; text-align: center; }
    /* timeline */
    .tl { border-left: 3px solid var(--brand2); margin-left: 8px; padding-left: 18px; display: flex; flex-direction: column; gap: 14px; }
    .tl .ev { position: relative; display: flex; gap: 10px; align-items: baseline; }
    .tl .ev::before { content: ""; position: absolute; left: -26px; top: 6px; width: 11px; height: 11px; border-radius: 50%; background: var(--brand2); }
    .tl .ev.pending::before { background: #cbd5e1; }
    .tl .ev.pending .lbl { color: var(--muted); }
    .tl .lbl { font-size: 14px; font-weight: 600; }
    .tl .tm { font-size: 12px; color: var(--muted); margin-left: auto; }
    /* history */
    .hist { display: flex; align-items: center; gap: 10px; font-size: 13px; padding: 8px 0; border-bottom: 1px dashed var(--border); }
    .hist:last-child { border-bottom: 0; }
    .hist time { color: var(--muted); font-size: 12px; margin-left: auto; }
    .hint { margin-top: 14px; font-size: 12px; color: var(--muted); background: #f8fafc; border: 1px dashed var(--border); border-radius: 10px; padding: 10px; line-height: 1.7; }
  </style>
</head>
<body>
  <header>
    <h1>✈️ MCP App · 航班助手</h1>
    <span class="pill">FastMCP · Streamable HTTP · App UI</span>
  </header>

  <main>
    <!-- 左侧：App 操作区 -->
    <section class="panel">
      <h2>搜索航班</h2>
      <div class="field">
        <label for="in-from">出发城市</label>
        <input id="in-from" value="北京">
      </div>
      <div class="field">
        <label for="in-to">到达城市</label>
        <input id="in-to" value="上海">
      </div>
      <div class="field">
        <label for="in-date">日期</label>
        <input id="in-date" value="今天">
      </div>
      <button class="btn" id="btn-search_flights" onclick="callSearch()">🔍 搜索航班</button>

      <h2 style="margin-top:18px">航班详情</h2>
      <div class="field">
        <label for="in-fid">航班号（点击左侧航班自动填入）</label>
        <input id="in-fid" value="CA1234">
      </div>
      <button class="btn" id="btn-get_flight" onclick="callDetail()">📄 查询详情</button>
      <button class="btn ghost" id="btn-track_flight" onclick="callTrack()">🛰 实时追踪</button>

      <div class="hint">
        <b>MCP App 数据契约</b><br>
        <code>search_flights</code> → 航班列表卡片<br>
        <code>get_flight</code> → 航班详情卡片<br>
        <code>track_flight</code> → 行程时间线<br>
        每个工具返回结构化数据，由本前端渲染成不同 UI。
      </div>
    </section>

    <!-- 右侧：渲染结果 -->
    <section class="panel">
      <h2>渲染结果</h2>
      <div id="render">
        <div class="empty">👈 搜索航班并点击结果，这里会渲染成对应的 App UI</div>
      </div>
      <div id="status"></div>
    </section>

    <!-- 调用历史 -->
    <section class="panel" style="grid-column:1 / -1">
      <h2>调用历史</h2>
      <div id="history"><div class="empty">暂无调用记录</div></div>
    </section>
  </main>

  <script>
    const MCP_URL = "/mcp";
    const HISTORY_MAX = 12;

    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));

    // 生成可嵌入 HTML onclick 的 JS 字符串字面量
    const jsq = (s) => "'" + String(s).replace(/\\/g, "\\\\").replace(/'/g, "\\'") + "'";

    function extractResult(data) {
      if (!data || data.result == null) return null;
      const r = data.result;
      if (r.structuredContent != null) return r.structuredContent;
      const text = Array.isArray(r.content) && r.content[0] && r.content[0].text;
      if (text) { try { return JSON.parse(text); } catch (_) { return text; } }
      return r;
    }

    function setBusy(tool, busy) {
      const btn = document.getElementById("btn-" + tool);
      if (btn) { btn.disabled = busy; btn.innerHTML = busy ? '<span class="spinner"></span>调用中…' : btn.dataset.label; }
    }

    function setStatus(msg) { document.getElementById("status").textContent = msg; }

    async function callMCP(tool, kind, args) {
      setBusy(tool, true);
      setStatus("正在调用 " + tool + " …");
      try {
        const res = await fetch(MCP_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept": "application/json, text/event-stream" },
          body: JSON.stringify({ jsonrpc: "2.0", id: Date.now(), method: "tools/call", params: { name: tool, arguments: args } })
        });
        const data = await res.json();
        const payload = extractResult(data);
        if (data.result && data.result.isError) throw new Error(payload ? JSON.stringify(payload) : "MCP 调用失败");
        if (payload == null) throw new Error("空响应：" + JSON.stringify(data));
        render(kind, payload, args);
        pushHistory(kind, tool, args);
        setStatus("✅ " + tool + " 调用成功");
      } catch (e) {
        document.getElementById("render").innerHTML = '<div class="error">调用失败：' + esc(e.message || e) + "</div>";
        setStatus("❌ 调用失败");
      } finally {
        setBusy(tool, false);
      }
    }

    // ---------- 各工具专属渲染器 ----------

    function render(kind, payload, args) {
      const el = document.getElementById("render");
      const fn = { flights: renderFlights, detail: renderDetail, track: renderTrack }[kind];
      el.innerHTML = (fn ? fn(payload, args) : '<pre class="empty">' + esc(JSON.stringify(payload, null, 2)) + "</pre>");
    }

    const badge = (s) => ({
      scheduled: '<span class="badge info">计划中</span>',
      boarding: '<span class="badge ok">登机中</span>',
      departed: '<span class="badge ok">已起飞</span>',
      delayed: '<span class="badge warn">延误</span>',
      cancelled: '<span class="badge err">取消</span>',
      landed: '<span class="badge info">已到达</span>',
      checkin: '<span class="badge info">值机中</span>',
      flying: '<span class="badge ok">飞行中</span>',
      landing: '<span class="badge warn">降落中</span>',
      arrived: '<span class="badge ok">已到达</span>',
    })[s] || esc(s);

    function renderFlights(flights) {
      const items = (flights || []).map((f) => `
        <div class="flight" onclick="pickFlight(${jsq(f.flight_id)}, ${jsq(f.from)}, ${jsq(f.to)})">
          <div class="f-top">
            <span class="f-id">${esc(f.airline)} ${esc(f.flight_id)}</span>
            ${badge(f.status)}
          </div>
          <div class="f-route">${esc(f.from)} ✈ ${esc(f.to)}</div>
          <div class="f-time">${esc(f.depart)} — ${esc(f.arrive)} · ${esc(f.date)}</div>
          <div class="f-meta">
            <span>飞行 ${esc(f.duration)} 分钟</span>
            <span>¥${esc(f.price)}</span>
            <span>${f.on_time ? "准点" : "可能延误"}</span>
          </div>
        </div>`).join("");
      return `<div>${items || '<div class="empty">没有匹配的航班</div>'}</div>`;
    }

    function renderDetail(f) {
      return `
        <div class="card">
          <div class="d-route">
            <div class="city">${esc(f.from)}</div>
            <div class="air">${esc(f.airline)} ${esc(f.flight_id)} · ${esc(f.model)}<br>${esc(f.depart)} — ${esc(f.arrive)}</div>
            <div class="city">${esc(f.to)}</div>
          </div>
          <div style="padding:8px 4px 0"><span style="font-size:14px;font-weight:600">状态：</span>${badge(f.status)} ${esc(f.status_zh)}${f.delay_min ? '（延误 ' + esc(f.delay_min) + ' 分钟）' : ""}</div>
          <div class="d-grid">
            <div><b>¥${esc(f.price)}</b><span>经济舱</span></div>
            <div><b>${esc(f.gate)}</b><span>登机口</span></div>
            <div><b>${esc(f.terminal)}</b><span>航站楼</span></div>
          </div>
        </div>`;
    }

    function renderTrack(t) {
      const rows = (t.timeline || []).map((e) => `
        <div class="ev ${e.done ? "" : "pending"}">
          <span class="lbl">${esc(e.label)}</span>
          <span class="tm">${esc(e.time)}</span>
        </div>`).join("");
      return `
        <div style="margin-bottom:12px"><b>${esc(t.flight_id)}</b> · 当前状态：${badge(t.status)} ${esc(t.status_zh)}</div>
        <div class="tl">${rows || '<div class="empty">暂无数据</div>'}</div>`;
    }

    // ---------- 交互 ----------

    function pickFlight(fid, from, to) {
      document.getElementById("in-fid").value = fid;
      setStatus("已选择 " + fid + "，可查看详情或实时追踪");
    }

    function pushHistory(kind, tool, args) {
      const box = document.getElementById("history");
      if (box.querySelector(".empty")) box.innerHTML = "";
      const icons = { flights: "🔍", detail: "📄", track: "🛰" };
      const line = document.createElement("div");
      line.className = "hist";
      line.innerHTML = `<span>${icons[kind] || "🛠"}</span><b>${esc(tool)}</b><span>${esc(JSON.stringify(args))}</span><time>${new Date().toLocaleTimeString()}</time>`;
      box.prepend(line);
      while (box.children.length > HISTORY_MAX) box.lastChild.remove();
    }

    document.querySelectorAll("button").forEach((b) => { b.dataset.label = b.textContent; });

    function callSearch() {
      callMCP("search_flights", "flights", {
        from_city: document.getElementById("in-from").value || "北京",
        to_city: document.getElementById("in-to").value || "上海",
        date: document.getElementById("in-date").value || "今天"
      });
    }
    function callDetail() {
      callMCP("get_flight", "detail", { flight_id: document.getElementById("in-fid").value || "CA1234" });
    }
    function callTrack() {
      callMCP("track_flight", "track", { flight_id: document.getElementById("in-fid").value || "CA1234" });
    }
  </script>
</body>
</html>
