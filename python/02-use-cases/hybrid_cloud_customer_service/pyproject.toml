[project]
name = "hybrid-cloud-customer-service"
version = "0.3.0"
description = "AgentKit hybrid-cloud customer-service demo"
requires-python = ">=3.10,<3.14"
dependencies = [
  "agentkit-sdk-python==0.5.5",
  "veadk-python==0.5.40",
  "a2a-sdk>=0.3.7,<1.0",
  "fastapi==0.124.1",
  "starlette==0.49.1",
  "httpx>=0.27,<1",
  "requests>=2.31,<3",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = ["jupyterlab>=4,<5", "pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
