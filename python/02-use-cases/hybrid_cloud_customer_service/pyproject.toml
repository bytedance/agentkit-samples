[project]
name = "hybrid-cloud-customer-service"
version = "0.3.0"
description = "AgentKit hybrid-cloud customer-service demo"
requires-python = ">=3.12,<3.14"
dependencies = [
  "veadk-python[extensions]==1.1.2",
  "google-adk==2.2.0",
  "agentkit-sdk-python==0.8.1",
  "urllib3<2.0.0",
  "volcengine-python-sdk>=4.0.33",
  "litellm==1.83.14",
  "a2a-sdk>=0.3.7,<1.0",
  "fastapi==0.141.1",
  "starlette==1.6.0",
  "httpx>=0.27,<1",
  "requests>=2.31,<3",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = ["jupyterlab>=4,<5", "pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
