name: LangChain 迁移示例
name_en: LangChainMigrationSample
description: LangChain 项目迁移到 AgentKit Runtime 示例
details: 本示例展示如何将已有 LangChain Runnable 旅行规划项目迁移到 AgentKit Runtime，保留原生 agent.py 业务入口，并通过 LiteLLM 接入真实模型节点。
tags:
  industry: 信息技术服务
  from: volcengine
  framework: langchain
  language: python
  tech:
    - LangChain
    - LiteLLM
    - AgentKit
    - web_search
type: tutorial
scenarios:
  - name: 框架迁移
    desc: 将存量 LangChain 接入运行时
  - name: 旅行规划
    desc: 基于搜索生成旅行路线
prompts:
  - text: 我想带父母去北京玩3天，总预算3000元，喜欢历史文化和轻松行程。
  - text: 我想去成都玩2天，预算2000元，喜欢美食和城市街区。
envs:
  - name: 模型名称
    key: MODEL_AGENT_NAME
    url: https://console.volcengine.com/ark/region:ark+cn-beijing/endpoint
  - name: 模型 Provider
    key: MODEL_AGENT_PROVIDER
    url: https://docs.litellm.ai/docs/providers
  - name: 模型 API 地址
    key: MODEL_AGENT_API_BASE
    url: https://console.volcengine.com/ark/region:ark+cn-beijing/endpoint
  - name: 模型 API Key
    key: MODEL_AGENT_API_KEY
    url: https://console.volcengine.com/ark/region:ark+cn-beijing/apiKey
  - name: 火山引擎访问密钥
    key: VOLCENGINE_ACCESS_KEY
    url: https://console.volcengine.com/iam/keymanage/
  - name: 火山引擎密钥
    key: VOLCENGINE_SECRET_KEY
    url: https://console.volcengine.com/iam/keymanage/
models:
  - <Your Model Name>
