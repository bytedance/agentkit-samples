name: Strands 迁移示例
name_en: StrandsMigrationSample
description: Strands 项目迁移到 AgentKit Runtime 示例
details: 本示例展示如何将已有 Strands Agent 旅行规划项目迁移到 AgentKit Runtime，保留 agent.py 中的 Agent 工厂入口和工具注册，并通过 Strands OpenAI provider 接入真实模型节点。
tags:
  industry: 信息技术服务
  from: volcengine
  framework: strands
  language: python
  tech:
    - Strands
    - OpenAIModel
    - AgentKit
    - web_search
type: tutorial
scenarios:
  - name: Agent迁移
    desc: 将存量 Strands 接入运行时
  - name: 旅行规划
    desc: 基于工具生成旅行路线
prompts:
  - text: 我想带父母去北京玩3天，总预算3000元，喜欢历史文化和轻松行程。
  - text: 我想去西安玩2天，预算1800元，喜欢历史遗迹和当地小吃。
envs:
  - name: 模型名称
    key: MODEL_AGENT_NAME
    url: https://console.volcengine.com/ark/region:ark+cn-beijing/endpoint
  - name: 模型 Provider
    key: MODEL_AGENT_PROVIDER
    url: https://strandsagents.com/latest/user-guide/concepts/model-providers/openai/
  - name: 模型 API 地址
    key: MODEL_AGENT_API_BASE
    url: https://console.volcengine.com/ark/region:ark+cn-beijing/endpoint
  - name: 模型 API Key
    key: MODEL_AGENT_API_KEY
    url: https://console.volcengine.com/ark/region:ark+cn-beijing/apiKey
  - name: 火山引擎访问密钥
    key: VOLCENGINE_ACCESS_KEY
    url: https://console.volcengine.com/iam/keymanage/
  - name: 火山引擎密钥
    key: VOLCENGINE_SECRET_KEY
    url: https://console.volcengine.com/iam/keymanage/
models:
  - <Your Model Name>
